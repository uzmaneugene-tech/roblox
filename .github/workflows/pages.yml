name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test application and install Chromium
        run: |
          npm ci
          npm test
          npx playwright install --with-deps chromium
      - name: Stage the Pages artifact
        run: |
          mkdir -p _site
          bash scripts/prepare-pages.sh _site/roblox
      - name: Smoke test Pages under /roblox/
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory _site &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 5 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:8000/roblox/
          node scripts/pages-smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site/roblox
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
